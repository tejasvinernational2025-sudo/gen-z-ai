name: Refresh npm lock securely

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Install exact lockfile
        run: npm ci

      - name: Production security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Refresh lockfile after security dependency update"
            git push
          fi
