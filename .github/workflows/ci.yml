name: Gen-z AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build


  debug-telugu-quiz:
    if: github.event_name == 'pull_request' && github.head_ref == 'debug-telugu-adaptive-quiz'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe Telugu adaptive quiz
        run: bash scripts/debug-telugu-quiz.sh
